[workspace]
resolver = "2"
members = ["r1csipa", "ecdsa_pops", "rok"]

[workspace.package]
authors = ["Alexandros Zacharakis <alexandroszacharakis8@gmail.com", "TODO"]

edition = "2021"
[workspace.dependencies]
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bellpepper-core = { version = "0.4.0", default-features = false }
bellpepper = { version = "0.4.0", default-features = false }
ff = { version = "0.13.0", features = ["derive"] }
merlin = { version = "3.0.0", default-features = false }
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2.14"
ark-std = "0.4.0"
ark-ff = { version = "^0.4.1", default-features = false }
ark-ec = { version = "^0.4.1", default-features = false }
ark-serialize = { version = "^0.4.1", default-features = false, features = [ "derive" ] }
rand_core = { version = "0.6", default-features = false }

halo2curves = { git = "https://github.com/zaverucha/signature-proof", features = [
  "derive_serde",
  "bits",
  "serde",
] }
