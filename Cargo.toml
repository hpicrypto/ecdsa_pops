[workspace]
resolver = "2"
members = ["r1csipa", "ecdsa_pops", "rok", "pop_circuit_ffa"]

[workspace.package]
edition = "2021"
repository = "https://github.com/hpicrypto/ecdsa_pops"
[workspace.dependencies]
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bellpepper-core = { version = "0.4.0", default-features = false }
bellpepper = { version = "0.4.0", default-features = false }
ff = { version = "0.13.0", features = ["derive"] }
merlin = { version = "3.0.0", default-features = false }
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2.14"
ark-std = { version = "0.4.0", features = ["getrandom"] }
ark-ff = { version = "^0.4.1", default-features = false }
ark-ec = { version = "^0.4.1", default-features = false }
ark-serialize = { version = "^0.4.1", default-features = false, features = [
  "derive",
] }
rand_core = { version = "0.6", default-features = false }

halo2curves = { version = "0.10", features = ["derive_serde", "bits", "serde"] }

# Redirect midnight-* from crates.io to the ecdsa_pop git branch.
# The branch bumps midnight-proofs to 0.7.2 and midnight-circuits to 6.2.0
# (above crates.io), so Cargo's resolver picks the patched git versions.
[patch.crates-io]
midnight-curves = { git = "https://github.com/midnightntwrk/midnight-zk", branch = "iquerejeta/ecdsa_pop" }
midnight-proofs = { git = "https://github.com/midnightntwrk/midnight-zk", branch = "iquerejeta/ecdsa_pop" }
midnight-circuits = { git = "https://github.com/midnightntwrk/midnight-zk", branch = "iquerejeta/ecdsa_pop" }
midnight-zk-stdlib = { git = "https://github.com/midnightntwrk/midnight-zk", branch = "iquerejeta/ecdsa_pop" }
sha3-circuit = { git = "https://github.com/alexandroszacharakis8/sha3-circuit", branch = "midnight0.7.2" }
