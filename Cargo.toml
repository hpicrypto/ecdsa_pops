[workspace]
resolver = "2"
members = ["r1csipa", "ecdsa_pops", "rok", "pop_circuit_ffa", "CDLS/pedersen", "CDLS/t256", "CDLS/macros"]

[workspace.package]
edition = "2021"
repository = "https://github.com/hpicrypto/ecdsa_pops"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bellpepper-core = { version = "0.4.0", default-features = false }
bellpepper = { version = "0.4.0", default-features = false }
ff = { version = "0.13.0", features = ["derive"] }
merlin = { version = "3.0.0", default-features = false }
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2.14"
ark-std = { version = "0.4.0", features = ["getrandom"] }
ark-ff = { version = "^0.4.1", default-features = false }
ark-ec = { version = "^0.4.1", default-features = false }
ark-serialize = { version = "^0.4.1", default-features = false, features = [
  "derive",
] }
rand_core = { version = "0.6", default-features = false }

halo2curves = { version = "0.10", features = ["derive_serde", "bits", "serde", "std"] }

# Redirect midnight-* from crates.io to midnight-zk main.
# rev should be af4bd615036dbab66fece84fd354c6d4cf7d4638 but cannot directly put here due to deps
[patch.crates-io]
midnight-curves = { git = "https://github.com/midnightntwrk/midnight-zk", branch = "main" }
midnight-proofs = { git = "https://github.com/midnightntwrk/midnight-zk", branch = "main" }
midnight-circuits = { git = "https://github.com/midnightntwrk/midnight-zk", branch = "main" }
midnight-zk-stdlib = { git = "https://github.com/midnightntwrk/midnight-zk", branch = "main" }
ark-secp256r1 = { git = "https://github.com/arkworks-rs/curves", rev = "e2d16a27" }
